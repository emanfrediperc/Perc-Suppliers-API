name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit + e2e (Mongo rs0)
    runs-on: ubuntu-latest
    # e2e con Mongo rs0 es lento; 25 min para que cierre en verde (antes 15 timeouteaba).
    timeout-minutes: 25

    env:
      MONGODB_URI: mongodb://localhost:27017/perc-suppliers-test?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-for-testing-only
      ENABLE_MAGIC_LINK: 'true'
      MAGIC_LINK_BASE_URL: http://localhost:4200/aprobar
      MAGIC_LINK_TTL_HOURS: '48'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Start MongoDB with replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          echo "Waiting for mongod..."
          until docker exec mongo mongosh --quiet --eval "db.runCommand({ping:1}).ok" >/dev/null 2>&1; do
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval '
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })
          '
          echo "Waiting for PRIMARY..."
          until docker exec mongo mongosh --quiet --eval 'rs.status().members[0].stateStr' 2>/dev/null | grep -q PRIMARY; do
            sleep 1
          done
          echo "MongoDB rs0 is ready."

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --ci

      - name: Seed test database
        run: npm run seed
        env:
          SEED_PASSWORD: admin123
          ALLOW_SEED: '1'

      - name: Run e2e tests
        run: npm run test:e2e -- --runInBand
        env:
          NODE_ENV: test

      - name: Dump MongoDB logs on failure
        if: failure()
        run: docker logs mongo --tail 200 || true

  smoke:
    name: Smoke — la imagen arranca y sirve
    runs-on: ubuntu-latest
    # Job PARALELO e independiente del e2e: valida que la imagen DESPLEGABLE
    # (node dist/main.js) arranque y sirva /api/docs antes de publicar/deployar.
    # Antes el smoke estaba como step DESPUES del e2e y quedaba skipped cuando
    # el e2e timeouteaba. Caza la clase de bug dist/main.js.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MongoDB (plano — solo para que el container arranque)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --bind_ip_all
          until docker exec mongo mongosh --quiet --eval "db.runCommand({ping:1}).ok" >/dev/null 2>&1; do
            sleep 1
          done
          echo "MongoDB listo."

      - name: Build Docker image
        run: docker build -t perc-api:smoke .

      - name: Run container + healthcheck /api/docs
        run: |
          # La imagen corre en NODE_ENV=production (Dockerfile), lo que activa dos
          # hardenings fail-closed:
          #  - CBU_ENC_KEY es OBLIGAToria: sin ella la app no arranca (no guarda el
          #    CBU en plaintext). Key dummy de 64 hex solo para el smoke.
          #  - Swagger (/api/docs) NO se monta salvo opt-in explicito. El healthcheck
          #    pega a /api/docs, asi que lo habilitamos SOLO en este container efimero.
          docker run -d --name api-smoke --network host \
            -e MONGODB_URI="mongodb://localhost:27017/smoke" \
            -e JWT_SECRET="ci-jwt-secret-at-least-32-characters-for-testing-only" \
            -e CBU_ENC_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" \
            -e SWAGGER_ENABLED=1 \
            -e PORT=3100 \
            perc-api:smoke

          echo "Esperando que el container sirva /api/docs..."
          ok=0
          for i in $(seq 1 30); do
            if ! docker ps --filter name=api-smoke --filter status=running -q | grep -q .; then
              echo "El container murió al arrancar:"; docker logs api-smoke; exit 1
            fi
            if curl -fsS http://localhost:3100/api/docs >/dev/null 2>&1; then
              ok=1; echo "Container UP y sirviendo (intento $i)."; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "El container no respondió /api/docs a tiempo:"; docker logs api-smoke; exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f api-smoke || true
